[package]
name = "nocturne-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Nocturne engine: the session and the command registry. Every user-visible action is a command"

[lints]
workspace = true

[dependencies]
nocturne-model = { workspace = true }
nocturne-formats = { workspace = true }
nocturne-store = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
web-time = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "json"] }
