[package]
name = "nocturne-ui-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Nocturne egui front end. Swappable: nothing below it depends on egui"

[lints]
workspace = true

[dependencies]
craft-i18n = { workspace = true }
nocturne-input-language = { path = "../input-language" }
nocturne-model = { workspace = true }
nocturne-ink = { workspace = true }
nocturne-text = { workspace = true }
nocturne-math = { workspace = true }
nocturne-formats = { workspace = true }
nocturne-store = { workspace = true }
nocturne-engine = { workspace = true }
nocturne-import = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
nocturne-diagram = { workspace = true }
image = { workspace = true }
jxl-oxide = { workspace = true }
hayro = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }
zip = { workspace = true }
# File > Check for updates: release versions and the SHA-256 of a download (see `update.rs`).
semver = "1"
sha2 = "0.10"
# SystemTime::now()/Instant::now() panic on wasm32-unknown-unknown; see the workspace Cargo.toml.
web-time = { workspace = true }

# The system file dialogs and the system clipboard. Mobile targets have neither through these
# crates: Android uses Java services (see `filepicker.android.rs` and `clipboard.android.rs`),
# and iOS uses `filepicker.ios.rs` plus `clipboard.ios.rs` as a safe stand-in while the `ios/`
# app shell injects a `UIPasteboard` clipboard at startup.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = { workspace = true }
arboard = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
fontdb = "0.23"
# File > About > "Check for updates": asks GitHub for the newest release, downloads the file for
# this computer and checks it against the release's SHA-256 before running it. Nothing is sent
# until the button is pressed.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "json"] }

[dev-dependencies]
egui_kittest = { workspace = true }
# The icon tests share one offscreen GPU device instead of building one per picture.
egui-wgpu = "0.37"


