[package]
name = "nocturne-ios"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Nocturne for iPadOS / iOS: native egui + wgpu Metal app shell"

[lib]
name = "nocturne_ios"
path = "src/lib.rs"

[[bin]]
name = "nocturne-ios"
path = "src/main.rs"

# The workspace forbids unsafe code globally, which cannot be relaxed per item.
# UIKit `UIPasteboard` accessors in `src/clipboard.rs` are marked `unsafe` in `objc2-ui-kit`
# for thread-safety checks, so this crate denies unsafe code and allows it only on those
# main-thread-checked FFI calls.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

# Platform-neutral modules (`storage`, `inbox`, `pasteboard_codec`) stay testable on all hosts.
[dependencies]
egui = { workspace = true }
image = { workspace = true }
log = { workspace = true }
nocturne-engine = { workspace = true }
nocturne-formats = { workspace = true }
nocturne-import = { workspace = true }
nocturne-model = { workspace = true }
nocturne-store = { workspace = true }
nocturne-ui-egui = { workspace = true }

[target.'cfg(target_os = "ios")'.dependencies]
block2 = "0.6"
eframe = { workspace = true, default-features = false, features = ["default_fonts", "wgpu"] }
nocturne-setup = { path = "../apps/nocturne-setup" }
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["CFCGTypes", "objc2"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSArray", "NSAttributedString", "NSBundle", "NSData", "NSDate", "NSDictionary", "NSError", "NSNotification", "NSObjCRuntime", "NSObject", "NSOperation", "NSPathUtilities", "NSProcessInfo", "NSRange", "NSString", "NSURL", "NSURLRequest", "NSURLResponse", "NSURLSession", "NSValue"] }
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "bitflags", "block2", "objc2-core-foundation", "NSText", "UIAction", "UICommand", "UIEditMenuInteraction", "UIEvent", "UIGeometry", "UIGestureRecognizer", "UIImage", "UIIndirectScribbleInteraction", "UIInteraction", "UIMenu", "UIMenuController", "UIMenuElement", "UIPanGestureRecognizer", "UIPasteboard", "UIPencilInteraction", "UIPinchGestureRecognizer", "UIResponder", "UIScreen", "UIScribbleInteraction", "UITapGestureRecognizer", "UITextInput", "UITextInputTraits", "UITouch", "UIView", "UIWindow"] }
objc2-vision = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "VNObservation", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler", "VNTypes"] }
raw-window-handle = "0.6"
time = { workspace = true }

[dev-dependencies]
nocturne-store = { workspace = true }
